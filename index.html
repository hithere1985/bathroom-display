<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, height=480">
<title>Morning Display</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 800px; height: 480px; overflow: hidden; background: #fff; color: #111; }
  body { font-family: "Inter", Arial, Helvetica, sans-serif; padding: 16px 28px 12px; position: relative; }
  .muted { color: #5C5C5C; }

  /* Header */
  .head { display: flex; justify-content: space-between; align-items: baseline; height: 34px; }
  .date { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
  .rule { height: 2px; background: #111; }
  .rule.thin { height: 1px; }

  /* Main */
  .main { display: flex; height: 206px; }
  .now { width: 372px; padding-top: 18px; border-right: 1px solid #111; }
  .nowtop { display: flex; align-items: center; gap: 10px; }
  .nowtop svg { width: 70px; height: 70px; }
  .temp { font-size: 80px; font-weight: 800; letter-spacing: -4px; line-height: 0.9; }
  .cond { font-size: 20px; font-weight: 800; margin-top: 14px; line-height: 1; }
  .facts { font-size: 15px; font-weight: 600; color: #5C5C5C; margin-top: 10px; line-height: 1.45; }
  .facts b { color: #111; font-weight: 700; }

  .side { flex: 1; padding: 18px 0 0 26px; }
  .k { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #5C5C5C; line-height: 1; }
  .wear { font-size: 28px; font-weight: 800; letter-spacing: -1px; line-height: 1; margin-top: 8px; }
  .wet { font-size: 16px; font-weight: 700; margin-top: 8px; line-height: 1; }
  .hours { display: flex; margin-top: 16px; }
  .hr { flex: 1; text-align: center; }
  .hr .t { font-size: 13px; font-weight: 700; color: #5C5C5C; line-height: 1; }
  .hr svg { width: 30px; height: 30px; margin: 6px 0 4px; }
  .hr .v { font-size: 20px; font-weight: 800; line-height: 1; }
  .hr .p { font-size: 12px; font-weight: 700; color: #5C5C5C; margin-top: 5px; line-height: 1; }
  .hr .p.wet, .day .p.wet { color: #111; }

  /* Week */
  .week { display: flex; position: relative; height: 208px; }
  .day { flex: 1; position: relative; text-align: center; }
  .day .n { font-size: 16px; font-weight: 700; line-height: 1; }
  .day .bar { position: absolute; left: 50%; width: 26px; margin-left: -13px; background: #111; border-radius: 3px; z-index: 1; }
  .day .hi, .day .lo { position: absolute; left: 0; right: 0; font-size: 18px; font-weight: 800; line-height: 1; z-index: 1; }
  .day .hi span, .day .lo span { background: #fff; padding: 0 3px; }
  .day .lo { color: #5C5C5C; font-weight: 700; }
  .day .ft { position: absolute; left: 0; right: 0; top: 10px; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .day .ft svg { width: 28px; height: 28px; }
  .day .p { font-size: 13px; font-weight: 700; color: #5C5C5C; line-height: 1; }
  .err { font-size: 20px; font-weight: 700; padding: 120px 0; text-align: center; }
</style>
</head>
<body>
  <div class="head">
    <div class="date" id="dt"></div>
  </div>
  <div class="rule"></div>
  <div id="body"><div class="err">Loading weather…</div></div>

<script>
  // ===== SETTINGS =====
  const LAT = 37.3595, LON = 127.1052, TZ = "Asia/Seoul";   // Bundang-gu, Seongnam

  // ===== Date =====
  // No clock: the screen refreshes only every 30 minutes, so a time would be stale.
  const d0 = new Date();
  document.getElementById("dt").textContent = d0.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: TZ });

  // ===== Icons =====
  const CH = '<path d="M18 38h28a10 10 0 0 0 0-20 14 14 0 0 0-27-2A11 11 0 0 0 18 38z" fill="#fff"/>';
  const IC = {
    sun: '<circle cx="32" cy="32" r="11"/><g stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="58"/><line x1="6" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="19.3" y2="19.3"/><line x1="44.7" y1="44.7" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="19.3" y2="44.7"/><line x1="44.7" y1="19.3" x2="50.4" y2="13.6"/></g>',
    moon: '<path d="M38 10a22 22 0 1 0 16 34A18 18 0 0 1 38 10z" fill="#111"/>',
    partly: '<circle cx="22" cy="22" r="8"/><g stroke-linecap="round"><line x1="22" y1="5" x2="22" y2="9"/><line x1="5" y1="22" x2="9" y2="22"/><line x1="10" y1="10" x2="13" y2="13"/><line x1="34" y1="10" x2="31" y2="13"/></g><path d="M22 54h26a10 10 0 0 0 0-20 13 13 0 0 0-25-2A10 10 0 0 0 22 54z" fill="#fff"/>',
    cloud: '<path d="M16 48h30a11 11 0 0 0 0-22 15 15 0 0 0-29-2A12 12 0 0 0 16 48z" fill="#fff"/>',
    fog: '<g stroke-linecap="round"><line x1="10" y1="22" x2="54" y2="22"/><line x1="16" y1="32" x2="48" y2="32"/><line x1="10" y1="42" x2="54" y2="42"/><line x1="18" y1="52" x2="46" y2="52"/></g>',
    rain: CH + '<g stroke-linecap="round"><line x1="22" y1="44" x2="18" y2="54"/><line x1="32" y1="44" x2="28" y2="54"/><line x1="42" y1="44" x2="38" y2="54"/></g>',
    snow: CH + '<circle cx="22" cy="48" r="2.5" fill="#111"/><circle cx="32" cy="55" r="2.5" fill="#111"/><circle cx="42" cy="48" r="2.5" fill="#111"/>',
    storm: CH + '<polygon points="34,40 25,53 31,53 27,62 40,47 33,47 37,40" fill="#111" stroke="none"/>'
  };
  function key(c, day) {
    if (c <= 1) return day ? "sun" : "moon";
    if (c === 2) return day ? "partly" : "cloud";
    if (c === 3) return "cloud";
    if (c === 45 || c === 48) return "fog";
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
    if (c >= 95) return "storm";
    return "rain";
  }
  const svg = (c, day) => '<svg viewBox="0 0 64 64" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round">' + IC[key(c, day)] + '</svg>';
  const LBL = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Heavy snow",95:"Thunderstorms",96:"Storms, hail",99:"Storms, hail"};

  // What to wear, from today's forecast (°C; converted from the old 20/35/55/70 °F thresholds)
  function wear(hi, lo) {
    return lo < -7 ? "Heavy coat" : lo < 2 ? "Coat" : hi < 13 ? "Jacket" : hi < 21 ? "Light layer" : "Short sleeves";
  }
  function wet(pop, code) {
    const snow = (code >= 71 && code <= 77) || code === 85 || code === 86;
    return snow ? "Snow expected · " + pop + "% chance" : pop >= 40 ? "Bring an umbrella · " + pop + "% rain" : "No umbrella · " + pop + "% rain";
  }
  // Open-Meteo returns local times as "YYYY-MM-DDTHH:MM" in TZ. Format the text directly
  // so the result does not depend on the time zone of the machine rendering the page.
  function clock12(s, withMin) {
    const h = +s.slice(11, 13), m = s.slice(14, 16);
    return (h % 12 || 12) + (withMin ? ":" + m : "") + " " + (h < 12 ? "AM" : "PM");
  }
  const hr12 = s => clock12(s, false);

  // ===== Weather =====
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,apparent_temperature,weather_code,is_day" +
    "&hourly=temperature_2m,precipitation_probability,weather_code,is_day" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunset" +
    "&temperature_unit=celsius&timezone=" + encodeURIComponent(TZ) + "&forecast_days=7";

  fetch(url).then(r => r.json()).then(w => {
    const c = w.current, D = w.daily, H = w.hourly, R = Math.round;
    const hi = D.temperature_2m_max.map(R), lo = D.temperature_2m_min.map(R);
    const pop = D.precipitation_probability_max.map(v => v ?? 0);
    const sunset = clock12(D.sunset[0], true);

    // Next four 3-hour slots starting at the next full hour
    const i0 = Math.max(0, H.time.indexOf(c.time.slice(0, 13) + ":00")) + 1;
    let hours = "";
    for (let k = 0; k < 4; k++) {
      const j = i0 + k * 3, p = H.precipitation_probability[j] ?? 0;
      hours += '<div class="hr"><div class="t">' + hr12(H.time[j]) + '</div>' + svg(H.weather_code[j], H.is_day[j]) +
               '<div class="v">' + R(H.temperature_2m[j]) + '°</div><div class="p' + (p >= 40 ? " wet" : "") + '">' + p + '%</div></div>';
    }

    // Range bars for the next six days on one shared scale (bar zone 64-184px within the row)
    const wh = hi.slice(1), wl = lo.slice(1);
    let yMin = Math.min(...wl), yMax = Math.max(...wh);
    if (yMax - yMin < 11) { const mid = (yMax + yMin) / 2; yMin = mid - 5.5; yMax = mid + 5.5; }
    const Y = v => 64 + 120 * (yMax - v) / (yMax - yMin);

    let week = "";
    for (let i = 1; i < 7; i++) {
      const nm = new Date(D.time[i] + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" });
      week += '<div class="day">' +
              '<div class="ft"><div class="n">' + nm + '</div>' + svg(D.weather_code[i], 1) +
              '<div class="p' + (pop[i] >= 40 ? " wet" : "") + '">' + pop[i] + '%</div></div>' +
              '<div class="hi" style="top:' + (Y(hi[i]) - 22) + 'px"><span>' + hi[i] + '°</span></div>' +
              '<div class="bar" style="top:' + Y(hi[i]) + 'px;height:' + Math.max(4, Y(lo[i]) - Y(hi[i])) + 'px"></div>' +
              '<div class="lo" style="top:' + (Y(lo[i]) + 6) + 'px"><span>' + lo[i] + '°</span></div></div>';
    }

    document.getElementById("body").innerHTML =
      '<div class="main">' +
        '<div class="now">' +
          '<div class="nowtop">' + svg(c.weather_code, c.is_day) + '<div class="temp">' + R(c.temperature_2m) + '°</div></div>' +
          '<div class="cond">' + (LBL[c.weather_code] || "") + '</div>' +
          '<div class="facts">Feels like <b>' + R(c.apparent_temperature) + '°</b> · High <b>' + hi[0] + '°</b> · Low <b>' + lo[0] + '°</b><br>Sunset ' + sunset + '</div>' +
        '</div>' +
        '<div class="side">' +
          '<div class="k">WEAR TODAY</div>' +
          '<div class="wear">' + wear(hi[0], lo[0]) + '</div>' +
          '<div class="wet">' + wet(pop[0], D.weather_code[0]) + '</div>' +
          '<div class="hours">' + hours + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="rule thin"></div>' +
      '<div class="week">' + week + '</div>';
  }).catch(() => {
    document.getElementById("body").innerHTML = '<div class="err">Weather unavailable. Check Wi-Fi and refresh.</div>';
  });
</script>
</body>
</html>
