<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, height=480">
<title>Morning Display</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 800px; height: 480px; overflow: hidden; background: #fff; color: #111; }
  body { font-family: "Inter", Arial, Helvetica, sans-serif; padding: 14px 30px 10px; position: relative; }

  /* Top band */
  .top { position: relative; height: 84px; }
  .left { position: absolute; left: 0; top: 0; display: flex; align-items: flex-start; gap: 6px; }
  .left svg { width: 62px; height: 62px; margin-top: 6px; }
  .temp { font-size: 58px; font-weight: 800; line-height: 1; letter-spacing: -2px; margin-top: 8px; }
  .cond { margin-left: 8px; margin-top: 12px; }
  .cond .c { font-size: 16px; font-weight: 700; line-height: 1; }
  .cond .s { font-size: 13px; color: #5C5C5C; margin-top: 8px; line-height: 1; }
  .center { position: absolute; left: 50%; top: 0; transform: translateX(-50%); text-align: center; width: 320px; }
  .clock { font-size: 50px; font-weight: 800; line-height: 1; letter-spacing: -1px; margin-top: 4px; }
  .clock span { font-size: 16px; font-weight: 700; letter-spacing: 0; margin-left: 8px; }
  .date { font-size: 15px; font-weight: 700; margin-top: 8px; }
  .right { position: absolute; right: 0; top: 0; text-align: right; }
  .right .k { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #5C5C5C; margin-top: 6px; }
  .right .v { font-size: 34px; font-weight: 800; line-height: 1; margin-top: 6px; }
  .right .d { font-size: 13px; font-weight: 700; margin-top: 10px; }
  .rule { height: 2px; background: #111; margin-top: 2px; }

  /* Columns */
  .week { position: relative; height: 370px; }
  .col { position: absolute; top: 0; width: 100px; text-align: center; }
  .col .day { font-size: 17px; font-weight: 700; margin-top: 12px; line-height: 1; }
  .col svg { width: 46px; height: 46px; position: absolute; left: 50%; transform: translateX(-50%); top: 262px; }
  .col .cc { position: absolute; left: 0; right: 0; top: 314px; font-size: 11px; color: #5C5C5C; line-height: 1; }
  .col .pp { position: absolute; left: 0; right: 0; top: 334px; font-size: 12px; font-weight: 700; color: #5C5C5C; line-height: 1; }
  .col .pp.wet { color: #111; }
  .grid { position: absolute; left: 40px; right: 0; height: 0; border-top: 1px dashed #B8B8B8; }
  .grid.frz { border-top: 1px dashed #111; }
  .glab { position: absolute; left: 0; width: 32px; text-align: right; font-size: 10px; color: #5C5C5C; transform: translateY(-50%); }
  .glab.frz { font-weight: 700; color: #111; }
  .bar { position: absolute; width: 30px; background: #111; border-radius: 3px; }
  .bar.open { background: #fff; border: 2px solid #111; }
  .tick { position: absolute; width: 52px; height: 3px; background: #111; }
  .now { position: absolute; font-size: 10px; font-weight: 700; transform: translateY(-50%); }
  .hi, .lo { position: absolute; width: 100px; text-align: center; font-size: 15px; font-weight: 700; line-height: 1; }
  .lo { color: #5C5C5C; }
  .err { font-size: 20px; font-weight: 700; padding: 60px 0; text-align: center; }
</style>
</head>
<body>
  <div class="top">
    <div class="left" id="left"></div>
    <div class="center">
      <div class="clock"><span id="t" style="font-size:inherit;font-weight:inherit;margin:0"></span><span id="ap"></span></div>
      <div class="date" id="dt"></div>
    </div>
    <div class="right" id="right"></div>
  </div>
  <div class="rule"></div>
  <div class="week" id="week"><div class="err">Loading weather…</div></div>

<script>
  // ===== SETTINGS =====
  const LAT = 43.3178, LON = -88.3790, TZ = "America/Chicago";   // Hartford, WI

  // ===== Time =====
  const d0 = new Date();
  const tp = d0.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ }).split(" ");
  document.getElementById("t").textContent = tp[0];
  document.getElementById("ap").textContent = tp[1] || "";
  document.getElementById("dt").textContent = d0.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: TZ });

  // ===== Icons =====
  const CH = '<path d="M18 38h28a10 10 0 0 0 0-20 14 14 0 0 0-27-2A11 11 0 0 0 18 38z" fill="#fff"/>';
  const IC = {
    sun: '<circle cx="32" cy="32" r="11"/><g stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="58"/><line x1="6" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="19.3" y2="19.3"/><line x1="44.7" y1="44.7" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="19.3" y2="44.7"/><line x1="44.7" y1="19.3" x2="50.4" y2="13.6"/></g>',
    moon: '<path d="M38 10a22 22 0 1 0 16 34A18 18 0 0 1 38 10z" fill="#111"/>',
    partly: '<circle cx="22" cy="22" r="8"/><g stroke-linecap="round"><line x1="22" y1="5" x2="22" y2="9"/><line x1="5" y1="22" x2="9" y2="22"/><line x1="10" y1="10" x2="13" y2="13"/><line x1="34" y1="10" x2="31" y2="13"/></g><path d="M22 54h26a10 10 0 0 0 0-20 13 13 0 0 0-25-2A10 10 0 0 0 22 54z" fill="#fff"/>',
    cloud: '<path d="M16 48h30a11 11 0 0 0 0-22 15 15 0 0 0-29-2A12 12 0 0 0 16 48z" fill="#fff"/>',
    fog: '<g stroke-linecap="round"><line x1="10" y1="22" x2="54" y2="22"/><line x1="16" y1="32" x2="48" y2="32"/><line x1="10" y1="42" x2="54" y2="42"/><line x1="18" y1="52" x2="46" y2="52"/></g>',
    rain: CH + '<g stroke-linecap="round"><line x1="22" y1="44" x2="18" y2="54"/><line x1="32" y1="44" x2="28" y2="54"/><line x1="42" y1="44" x2="38" y2="54"/></g>',
    snow: CH + '<circle cx="22" cy="48" r="2.5" fill="#111"/><circle cx="32" cy="55" r="2.5" fill="#111"/><circle cx="42" cy="48" r="2.5" fill="#111"/>',
    storm: CH + '<polygon points="34,40 25,53 31,53 27,62 40,47 33,47 37,40" fill="#111" stroke="none"/>'
  };
  function key(c, day) {
    if (c <= 1) return day ? "sun" : "moon";
    if (c === 2) return day ? "partly" : "cloud";
    if (c === 3) return "cloud";
    if (c === 45 || c === 48) return "fog";
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
    if (c >= 95) return "storm";
    return "rain";
  }
  const svg = (c, day) => '<svg viewBox="0 0 64 64" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round">' + IC[key(c, day)] + '</svg>';
  const LBL = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Heavy snow",95:"Thunderstorms",96:"Storms, hail",99:"Storms, hail"};

  // Dress-for-it from today's forecast
  function dress(hi, lo, pop, code) {
    let top = lo < 20 ? "Heavy coat" : lo < 35 ? "Coat" : hi < 55 ? "Jacket" : hi < 70 ? "Light layer" : "Short sleeves";
    let snow = (code >= 71 && code <= 77) || code === 85 || code === 86;
    let wet = snow ? "snow" : pop >= 40 ? "umbrella" : "no umbrella";
    return top + " · " + wet;
  }

  // ===== Weather =====
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,apparent_temperature,weather_code,is_day" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunset" +
    "&temperature_unit=fahrenheit&timezone=" + encodeURIComponent(TZ) + "&forecast_days=7";

  fetch(url).then(r => r.json()).then(w => {
    const c = w.current, D = w.daily, R = Math.round;
    const cur = R(c.temperature_2m);
    const hi = D.temperature_2m_max.map(R), lo = D.temperature_2m_min.map(R);
    const pop = D.precipitation_probability_max.map(v => v ?? 0);
    const sunset = new Date(D.sunset[0]).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ });

    document.getElementById("left").innerHTML = svg(c.weather_code, c.is_day) +
      '<div class="temp">' + cur + '°</div>' +
      '<div class="cond"><div class="c">' + (LBL[c.weather_code] || "") + '</div>' +
      '<div class="s">Feels like ' + R(c.apparent_temperature) + '°</div>' +
      '<div class="s">Sunset ' + sunset + '</div></div>';
    document.getElementById("right").innerHTML =
      '<div class="k">RAIN TODAY</div><div class="v">' + pop[0] + '%</div>' +
      '<div class="d">' + dress(hi[0], lo[0], pop[0], D.weather_code[0]) + '</div>';

    // Scale: fit the week, rounded to 10°, at least a 30° span, always include 32°
    let yMin = Math.floor((Math.min(...lo, cur, 30) - 2) / 10) * 10;
    let yMax = Math.ceil((Math.max(...hi, cur, 34) + 2) / 10) * 10;
    if (yMax - yMin < 30) yMax = yMin + 30;
    const top = 48, bot = 240;
    const Y = v => top + (bot - top) * (yMax - v) / (yMax - yMin);
    const colW = 700 / 7, cx = i => 40 + colW * (i + 0.5);

    let h = "";
    for (let g = yMin; g <= yMax; g += 10) {
      if (Math.abs(g - 32) < 4) continue;   // 32° line carries this slot
      h += '<div class="grid" style="top:' + Y(g) + 'px"></div><div class="glab" style="top:' + Y(g) + 'px">' + g + '°</div>';
    }
    h += '<div class="grid frz" style="top:' + Y(32) + 'px"></div><div class="glab frz" style="top:' + Y(32) + 'px">32°</div>';

    for (let i = 0; i < 7; i++) {
      const x = cx(i), nm = i === 0 ? "Today" : new Date(D.time[i] + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" });
      h += '<div class="col" style="left:' + (x - 50) + 'px"><div class="day">' + nm + '</div>' +
           svg(D.weather_code[i], 1) + '<div class="cc">' + (LBL[D.weather_code[i]] || "") + '</div>' +
           '<div class="pp' + (pop[i] >= 40 ? " wet" : "") + '">' + pop[i] + '% rain</div></div>';
      if (i === 0) {
        const n = Math.min(Math.max(cur, lo[0]), hi[0]);
        h += '<div class="bar open" style="left:' + (x - 15) + 'px;top:' + Y(hi[0]) + 'px;height:' + Math.max(4, Y(n) - Y(hi[0])) + 'px"></div>' +
             '<div class="bar" style="left:' + (x - 15) + 'px;top:' + Y(n) + 'px;height:' + Math.max(4, Y(lo[0]) - Y(n)) + 'px"></div>' +
             '<div class="tick" style="left:' + (x - 26) + 'px;top:' + (Y(n) - 1.5) + 'px"></div>' +
             '<div class="now" style="left:' + (x + 32) + 'px;top:' + Y(n) + 'px">now</div>';
      } else {
        h += '<div class="bar" style="left:' + (x - 15) + 'px;top:' + Y(hi[i]) + 'px;height:' + Math.max(4, Y(lo[i]) - Y(hi[i])) + 'px"></div>';
      }
      h += '<div class="hi" style="left:' + (x - 50) + 'px;top:' + (Y(hi[i]) - 24) + 'px">' + hi[i] + '°</div>' +
           '<div class="lo" style="left:' + (x - 50) + 'px;top:' + (Y(lo[i]) + 8) + 'px">' + lo[i] + '°</div>';
    }
    document.getElementById("week").innerHTML = h;
  }).catch(() => {
    document.getElementById("week").innerHTML = '<div class="err">Weather unavailable. Check Wi-Fi and refresh.</div>';
  });
</script>
</body>
</html>
